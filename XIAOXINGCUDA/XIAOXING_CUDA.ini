# whyXiaoXing
# 在消费级显卡中 ，单个 warps 通常不建议超过 512 ; block.x * block.y * block.z  ,warp
# dim3 与 block 关系到计算能力 nvidia-smi --query-gpu=name,compute_cap 可以查询
# 在这里 还需要考虑warps的横向传播
[d3dtocuda]
# 如果你觉得显卡占用率高可用改为 32 4  这里涉及到截图尺寸问题，目前只有两个选择，否则影响极大
# 这里if else 分支很多 warp不带分支预测， 且if else 会影响 warps 拆散
threadwidth=32
threadhight=8

[SWDTOnnx]
threadhight=64
threadwidth=8

# 用户信息
[USERMESSAGE]
GPU=0 # GPU选择 不懂就看 任务管理器
screen=1 # 屏幕分辨率  1是1k 2是2k 3是3k 4是4k
floatdatawidth=2730      # 计算公式 你的字节数/(128*3*4) 必须向上取整 建议 1MB起步 默认值是4MB  

# 这里参数需要有对应的开发板子DLL否则无效
[DEPmessage]
SaveJpeg=false # 开启保存图片，1是开0是关
SaveFrequency=50 #保存频率